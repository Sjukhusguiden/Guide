<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vägledning QR-kod</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px;
  background: #f2f2f2;
}

.box {
  background: white;
  padding: 40px;
  border-radius: 20px;
  font-size: 32px;
}

.small {
  margin-top: 20px;
  font-size: 16px;
  color: #666;
}

#reader {
  width: 100%;
  max-width: 400px;
  margin: 20px auto;
  border-radius: 16px;
}

/* ===== Mobil / portrait ===== */
@media (max-width: 768px) {
  body { padding: 20px; }
  h1 { font-size: 26px; }
  .box { padding: 30px 20px; font-size: 22px; border-radius: 16px; }
  .small { font-size: 14px; }
}
</style>

<!-- Include html5-qrcode library -->
<script src="https://unpkg.com/html5-qrcode@2.3.10/minified/html5-qrcode.min.js"></script>

</head>

<body>

<h1>📍 QR Navigation Test</h1>

<div class="box" id="instruction">Laddar...</div>
<div id="reader"></div>
<div class="small" id="debug"></div>

<script>
// =======================
// RUTTER MED STARTPUNKTER
// =======================
const routes = {
  entréA: {
    T4: {
      1: "🩻 T4: Ta trappan up 2 våningar",
      2: "🩻 T4: Gå rakt fram till trappan längst bort i korridoren",
      3: "🩻 T4: Ta rampen up till närmaste ingång till vänster",
      4: "🩻 T4: Du är nu framme i korridoren med T4 klassrummen"
    },
    akuten: {
      1: "🚑 Akuten: Gå rakt fram från entré A",
      2: "🚑 Akuten: Sväng höger",
      3: "🚑 Akuten: Följ röda linjen",
      4: "🚑 Akuten: Du är framme"
    }
  },

  entréB: {
    C303: {
      1: "🧪 C303: Gå till B205-227 korridoren och sväng höger",
      2: "🧪 C303: Gå till slutet av korridoren",
      3: "🧪 C303: Ta trappan upp till kopiatorn",
      4: "🧪 C303: gå framm till tredje dörren i korridoren, på den står det C303",
      5: "🧪 C303: Du är nu framme"
    }
  }
};

// =======================
// VISA INSTRUKTION
// =======================
const instructionDiv = document.getElementById("instruction");
const debugDiv = document.getElementById("debug");

let route = localStorage.getItem("route");
let dest = localStorage.getItem("dest");
let step = parseInt(localStorage.getItem("step") || "1");

function updateInstruction() {
  if (!route || !dest) {
    instructionDiv.textContent = "📍 Skanna en start-QR-kod i receptionen";
    return;
  }

  const routeData = routes[route]?.[dest];
  if (!routeData) {
    instructionDiv.textContent = "❌ Ingen väg hittades";
    return;
  }

  const maxStep = Math.max(...Object.keys(routeData).map(Number));
  if (step < 1) step = 1;
  if (step > maxStep) step = maxStep;

  instructionDiv.textContent = routeData[step];

  // Om sista steget, lägg till länk till formulär
  if (step === maxStep) {
    const formLink = document.createElement("a");
    formLink.href = "https://forms.office.com/Pages/ResponsePage.aspx?id=w-9zaNc360mUkFNgRBSBcPDwhgNalBlNg-rkgv_NWCBUQU5UV1pUSUxPMk9TREtNN1U1SVU2VVo1WS4u";
    formLink.textContent = "✅ Fyll i formuläret här";
    formLink.style.display = "block";
    formLink.style.marginTop = "20px";
    formLink.style.fontSize = "20px";
    instructionDiv.appendChild(formLink);
  }

  debugDiv.textContent = "Start: " + route + " | Destination: " + dest + " | Steg: " + step;
}

// Initial instruction display
updateInstruction();

// =======================
// QR SCANNING MED html5-qrcode
// =======================
function onScanSuccess(decodedText) {
  try {
    const url = new URL(decodedText);
    const params = new URLSearchParams(url.search);
    const newRoute = params.get("route");
    const newDest = params.get("dest");
    const newStep = parseInt(params.get("step"));

    if (newRoute) localStorage.setItem("route", newRoute);
    if (newDest) localStorage.setItem("dest", newDest);
    if (newStep) localStorage.setItem("step", newStep);

    route = localStorage.getItem("route");
    dest = localStorage.getItem("dest");
    step = parseInt(localStorage.getItem("step") || "1");

    updateInstruction();
  } catch (e) {
    console.error("Invalid QR code", e);
  }
}

// Start scanning continuously
const html5QrcodeScanner = new Html5Qrcode("reader");
html5QrcodeScanner.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 250 },
  onScanSuccess
).catch(err => {
  console.error("QR scanner error", err);
});
</script>

</body>
</html>
