<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR-kod vägledning Sundsvalls sjukhus</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px;
  background: #f2f2f2;
  display:flex;
}

.box {
  background: white;
  padding: 40px;
  border-radius: 20px;
  font-size: 32px;
}

.small {
  margin-top: 20px;
  font-size: 16px;
  color: #666;
}

#scanBtn {
  margin-top: 25px;
  padding: 16px 26px;
  font-size: 18px;
  border-radius: 14px;
  border: none;
  background: #0078d4;
  color: white;
  cursor: pointer;
}

#camera {
  display: none;
  margin: 20px auto 0;
  width: 100%;
  max-width: 400px;
  border-radius: 14px;
}

.guide { width:50%; }

.map {
  position: relative;
  width: 50%;
}

.map img {
  width: 100%;
  display: block;
  border-radius: 14px;
}

/* SVG overlay */
.overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* Yellow guidance line */
.overlay path {
  fill: none;
  stroke: #ffd400;
  stroke-width: 14;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: none;
  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;
  animation: draw 1s ease forwards;
}

@keyframes draw {
  to { stroke-dashoffset: 0; }
}
</style>
</head>

<body>

<div class="guide">
  <h1>📍 QR Navigation Test</h1>
  <div class="box" id="instruction">Laddar...</div>
  <div class="small" id="debug"></div>

  <button id="scanBtn">📷 Skanna ny QR-kod</button>
  <video id="camera" playsinline></video>
  <div id="html5-qrcode" style="width:100%;max-width:400px;margin:20px auto;"></div>
</div>

<div class="map">
  <img id="floor-map" src="floor1.jpeg" alt="Map">
  <svg viewBox="0 0 1000 600" class="overlay">
    <path id="guide-line" d="" />
  </svg>
</div>

<script>
// =======================
// ROUTES, LINES & FLOOR IMAGES
// =======================
const routes = {
  "entréA": {
    "T4": {
      1: "🩻 T4: Ta trappan up 2 våningar",
      2: "🩻 T4: Gå rakt fram till trappan längst bort i korridoren",
      3: "🩻 T4: Ta rampen up till närmaste ingång till vänster",
      4: "🩻 T4: Du är nu framme"
    }
  },
  "entréB": {
    "C303": {
      1: "🧪 C303: Gå till B205-227 korridoren och sväng höger",
      2: "🧪 C303: Gå till slutet av korridoren",
      3: "🧪 C303: Ta trappan upp till kopiatorn",
      4: "🧪 C303: Gå fram till tredje dörren i korridoren, på den står det C303",
      5: "🧪 C303: Du är nu framme"
    }
  }
};

// Lines per route+destination+step
const linesByRoute = {
  "entréA-T4": {
    1: "M150 350 L500 312",
    2: "M500 312 L500 160",
    3: "M500 160 L750 160",
    4: "M750 160 L750 80"
  },
  "entréB-C303": {
    1: "M100 500 L400 500",
    2: "M400 500 L400 300",
    3: "M400 300 L700 300",
    4: "M700 300 L700 100",
    5: "M700 100 L900 100"
  }
};

// Floor images per route+destination+step
const floorImages = {
  "entréA-T4": {
    1: "floor.jpeg",
    2: "floor.jpeg",
    3: "floor.jpeg",
    4: "floor.jpeg"
  },
  "entréB-C303": {
    1: "floor.jpeg",
    2: "floor.jpeg",
    3: "floor.jpeg",
    4: "floor1.png",
    5: "floor1.png"
  }
};

// =======================
// URL + STORAGE
// =======================
const params = new URLSearchParams(window.location.search);
let step = parseInt(params.get("step") || "1");

if (params.get("route")) localStorage.setItem("route", params.get("route"));
if (params.get("dest")) localStorage.setItem("dest", params.get("dest"));

const route = localStorage.getItem("route");
const dest = localStorage.getItem("dest");

// =======================
// UPDATE LINE & IMAGE
// =======================
const guideLine = document.getElementById("guide-line");
const floorMap = document.getElementById("floor-map");

function updateGuideLine() {
  if (!route || !dest) return;
  const key = `${route}-${dest}`;
  const stepLines = linesByRoute[key];
  if (!stepLines || !stepLines[step]) {
    guideLine.style.display = "none";
    return;
  }
  guideLine.setAttribute("d", stepLines[step]);
  guideLine.style.display = "block";
  guideLine.style.animation = "none";
  guideLine.getBoundingClientRect();
  guideLine.style.animation = "";
}

function updateFloorImage() {
  if (!route || !dest) return;
  const key = `${route}-${dest}`;
  const stepImages = floorImages[key];
  if (!stepImages || !stepImages[step]) return;
  floorMap.src = stepImages[step];
}

// =======================
// SHOW INSTRUCTION
// =======================
const instructionDiv = document.getElementById("instruction");
const debugDiv = document.getElementById("debug");

function showInstruction() {
  if (!route || !dest) {
    instructionDiv.textContent = "📍 Skanna en start-QR-kod i receptionen";
    return;
  }

  const routeData = routes[route]?.[dest];
  if (!routeData) {
    instructionDiv.textContent = "❌ Ingen väg hittades";
    return;
  }

  const maxStep = Math.max(...Object.keys(routeData));
  if (step > maxStep) step = maxStep;

  instructionDiv.textContent = routeData[step];
  debugDiv.textContent = `Start: ${route} | Dest: ${dest} | Steg: ${step}`;

  updateGuideLine();
  updateFloorImage();
}

showInstruction();

// =======================
// QR SCANNER
// =======================
const scanBtn = document.getElementById("scanBtn");
const video = document.getElementById("camera");
let scanning = false;

scanBtn.addEventListener("click", async () => {
  instructionDiv.innerHTML = "📷 Rikta kameran mot QR-koden";

  if ("BarcodeDetector" in window) {
    const detector = new BarcodeDetector({ formats: ["qr_code"] });
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }});
    video.srcObject = stream;
    video.style.display = "block";
    await video.play();
    scanning = true;

    (async function loop(){
      if (!scanning) return;
      const codes = await detector.detect(video);
      if (codes.length) {
        scanning = false;
        window.location.href = codes[0].rawValue;
      }
      setTimeout(loop, 150);
    })();
  }
});
</script>

</body>
</html>
