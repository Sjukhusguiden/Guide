<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sjukhusguiden</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- Html5 QR Code -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
/* Enkel styling för stjärnor */
.star-rating {
    display: flex;
    gap: 5px;
    cursor: pointer;
}
.star-rating i {
    font-size: 1.5rem;
    color: #ccc;
}
.star-rating i.selected {
    color: gold;
}
.review-card {
    border: 1px solid #ccc;
    padding: 10px;
    margin-bottom: 5px;
    border-radius: 5px;
}
</style>
</head>
<body>

<section class="scanner-section">
    <h2><i class="fa-solid fa-qrcode"></i> QR-kod Scanner</h2>
    <button id="scanBtn" class="primary-btn"><i class="fa-solid fa-camera"></i> Starta scanning</button>
    <div id="instruction"></div>
    <div id="html5-qrcode"></div>
</section>

<section id="reviews" class="reviews">
    <h2><i class="fa-solid fa-star"></i> Recensioner</h2>
    <input id="name" placeholder="Ditt namn">
    <textarea id="reviewText" placeholder="Skriv din recension"></textarea>

    <div class="star-rating" id="starRating">
        <i class="fa-regular fa-star" data-value="1"></i>
        <i class="fa-regular fa-star" data-value="2"></i>
        <i class="fa-regular fa-star" data-value="3"></i>
        <i class="fa-regular fa-star" data-value="4"></i>
        <i class="fa-regular fa-star" data-value="5"></i>
    </div>

    <button id="sendReviewBtn">Skicka recension</button>
    <div id="reviewList"></div>
</section>

<script>
/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCkHZ9nebsrLQg0ovigpxXi9DcoZWIVEhM",
  authDomain: "sjukhusguiden.firebaseapp.com",
  projectId: "sjukhusguiden",
  storageBucket: "sjukhusguiden.firebasestorage.app",
  messagingSenderId: "122348406165",
  appId: "1:122348406165:web:e698bf6d32ac22f339a29c",
  measurementId: "G-3G6D5DZD7Z"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ===== QR-SCANNER ===== */
const scanBtn = document.getElementById("scanBtn");
const instructionDiv = document.getElementById("instruction");
let scanner;
let lastQR = null;

scanBtn.addEventListener("click", () => {
    instructionDiv.textContent = "Tillåt åtkomst till kameran och rikta mot QR-koden";

    if (scanner) scanner.clear().then(() => scanner = null);

    scanner = new Html5Qrcode("html5-qrcode");

    Html5Qrcode.getCameras().then(cameras => {
        if (cameras && cameras.length) {
            const cameraId = cameras[0].id;
            scanner.start(cameraId, { fps: 10, qrbox: 250 },
                qrCodeMessage => {
                    lastQR = qrCodeMessage; 
                    instructionDiv.innerHTML = `<strong>QR-kod:</strong> ${qrCodeMessage}`;
                    scanner.stop();
                },
                errorMessage => { console.log("QR scan error:", errorMessage); }
            ).catch(err => {
                instructionDiv.textContent = "Kunde inte starta kameran: " + err;
            });
        } else {
            instructionDiv.textContent = "Ingen kamera hittades";
        }
    }).catch(err => {
        instructionDiv.textContent = "Kunde inte hämta kameror: " + err;
    });
});

/* ===== STAR RATING ===== */
const starRating = document.getElementById("starRating");
let selectedStars = 0;

starRating.querySelectorAll("i").forEach(star => {
    star.addEventListener("click", () => {
        selectedStars = parseInt(star.dataset.value);
        updateStars(selectedStars);
    });
});

function updateStars(count) {
    starRating.querySelectorAll("i").forEach(star => {
        star.classList.toggle("selected", parseInt(star.dataset.value) <= count);
    });
}

/* ===== FIRESTORE REVIEWS ===== */
const sendReviewBtn = document.getElementById("sendReviewBtn");
const reviewListDiv = document.getElementById("reviewList");

sendReviewBtn.addEventListener("click", () => {
    const name = document.getElementById("name").value || "Anonym";
    const text = document.getElementById("reviewText").value;

    if (!text) return alert("Skriv en recension först!");
    if (selectedStars === 0) return alert("Välj ett betyg med stjärnor!");

    db.collection("reviews").add({
        name: name,
        text: text,
        stars: selectedStars,
        qrCode: lastQR || null,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
        document.getElementById("name").value = "";
        document.getElementById("reviewText").value = "";
        selectedStars = 0;
        updateStars(0);
        alert("Recension skickad!");
    }).catch(err => {
        console.error("Fel vid sparande:", err);
    });
});

// Visa reviews i realtid
db.collection("reviews").orderBy("timestamp", "desc").onSnapshot(snapshot => {
    reviewListDiv.innerHTML = "";
    snapshot.forEach(doc => {
        const data = doc.data();
        const starsHtml = "★".repeat(data.stars) + "☆".repeat(5 - data.stars);
        const div = document.createElement("div");
        div.className = "review-card";
        div.innerHTML = `<strong>${data.name}</strong> (${data.qrCode || "Ingen QR"}): <p>${starsHtml}</p><p>${data.text}</p>`;
        reviewListDiv.appendChild(div);
    });
});

/* ===== DROPDOWN MENU ===== */
function toggleMenu() {
    const menu = document.getElementById("dropdownMenu");
    menu.classList.toggle("show");
}
</script>

</body>
</html>
